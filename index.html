<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rilakkuma · 轻松熊生日祝福</title>
    <link rel="stylesheet" href="css/1.css">
    <style>
        /* ========== 全局ins风格主题 ========== */
        :root {
            --pink: #FFB6C1;
            --pink-light: #FFE4E9;
            --pink-lighter: #FFF0F5;
            --purple: #DDA0DD;
            --purple-light: #E6E6FA;
            --purple-lighter: #F5F0FF;
            --purple-dark: #8B5E8B;
            --blue: #87CEEB;
            --blue-light: #E0F0FF;
            --blue-lighter: #F0F8FF;
            --white: #FFFFFF;
            --cream: #FFF8F0;
            --text-dark: #5A5A6E;
            --text-medium: #8B8B9E;
            --text-light: #A0A0B0;
            --shadow-soft: 0 8px 25px rgba(200, 180, 220, 0.15);
            --shadow-hover: 0 12px 35px rgba(200, 180, 220, 0.25);
            --shadow-card: 0 4px 15px rgba(200, 180, 220, 0.1);
            --radius-small: 10px;
            --radius-medium: 15px;
            --radius-large: 20px;
            --radius-xl: 30px;
            --border-pink: 2px solid rgba(255, 182, 193, 0.3);
            --border-purple: 2px solid rgba(221, 160, 221, 0.3);
            --border-soft: 2px solid rgba(255, 182, 193, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, 
                #FFF0F5 0%, 
                #F5F0FF 25%, 
                #F0F8FF 50%, 
                #FFF5F7 75%, 
                #F8F0FF 100%);
            font-family: '楷体', 'KaiTi', 'STKaiti', '华文楷体', 'Microsoft YaHei', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            cursor: pointer;
        }

        /* ========== 鼠标点击特效 ========== */
        .click-effects-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .click-effect {
            position: fixed;
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            font-size: 24px;
            z-index: 9999;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
            50% { opacity: 0.8; transform: translateY(-50px) scale(0.8) rotate(10deg); }
            100% { opacity: 0; transform: translateY(-100px) scale(0.3) rotate(-10deg); }
        }

        /* ========== 主容器 ========== */
        .main-container {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 2rem;
            border: 2px solid rgba(221, 160, 221, 0.3);
            box-shadow: 0 8px 25px rgba(200, 180, 220, 0.15);
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }

        /* ========== 密码界面 ========== */
        .password-screen {
            text-align: center;
            padding: 2rem 1rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rilakkuma-family-img {
            width: 200px;
            height: auto;
            margin: 0 auto 20px;
            display: block;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(200, 180, 220, 0.15);
        }

        .password-title {
            font-size: 1.5rem;
            color: #DDA0DD;
            margin-bottom: 0.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .password-subtitle {
            color: #8B8B9E;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .password-input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 182, 193, 0.5);
            border-radius: 25px;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 1rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: '楷体', 'KaiTi', serif;
            background: rgba(255, 255, 255, 0.9);
            color: #5A5A6E;
        }

        .password-input:focus {
            border-color: #DDA0DD;
            box-shadow: 0 0 0 5px rgba(221, 160, 221, 0.2);
        }

        .password-btn {
            background: linear-gradient(135deg, #FFB6C1, #DDA0DD);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-family: '楷体', 'KaiTi', serif;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(221, 160, 221, 0.3);
        }

        .password-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(200, 180, 220, 0.25);
        }

        .error-msg {
            color: #E87A90;
            margin-top: 10px;
            min-height: 25px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .password-hint {
            color: #8B8B9E;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        /* ========== 音乐播放器 ========== */
        .music-player {
            background: linear-gradient(135deg, 
                rgba(255, 182, 193, 0.2), 
                rgba(221, 160, 221, 0.2),
                rgba(135, 206, 235, 0.2));
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid rgba(221, 160, 221, 0.3);
        }

        .music-player-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .music-icon {
            font-size: 1.5rem;
            animation: musicBounce 1s infinite;
        }

        @keyframes musicBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .music-title {
            font-size: 1.1rem;
            color: #8B5E8B;
            font-weight: 600;
        }

        .music-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .music-btn {
            background: white;
            border: 2px solid rgba(221, 160, 221, 0.5);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-btn:hover {
            background: #F5F0FF;
            transform: scale(1.1);
        }

        .music-play-btn {
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #FFB6C1, #DDA0DD);
            color: white;
            border: none;
        }

        .music-info {
            margin-bottom: 10px;
            color: #8B8B9E;
            font-size: 0.9rem;
        }

        .music-progress {
            width: 100%;
            height: 5px;
            background: rgba(255, 182, 193, 0.2);
            border-radius: 5px;
            overflow: hidden;
        }

        .music-progress-bar {
            height: 100%;
            background: linear-gradient(to right, #FFB6C1, #DDA0DD, #87CEEB);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 5px;
        }

        /* ========== 倒计时 ========== */
        .countdown-section {
            background: linear-gradient(135deg, #F5F0FF, #E0F0FF);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            border: 2px solid rgba(221, 160, 221, 0.3);
        }

        .countdown-title {
            font-size: 1.2rem;
            color: #8B5E8B;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .countdown-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 15px;
            min-width: 70px;
            box-shadow: 0 4px 12px rgba(200, 180, 220, 0.2);
        }

        .countdown-number {
            font-size: 2rem;
            font-weight: 700;
            color: #DDA0DD;
            display: block;
        }

        .countdown-label {
            font-size: 0.85rem;
            color: #8B8B9E;
            margin-top: 5px;
        }

        /* ========== 主内容 ========== */
        .main-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: linear-gradient(135deg, 
                rgba(255, 182, 193, 0.2), 
                rgba(221, 160, 221, 0.2),
                rgba(135, 206, 235, 0.2));
            border-radius: 20px;
            border: 2px solid rgba(255, 182, 193, 0.5);
        }

        .header h1 {
            font-size: 2rem;
            color: #8B5E8B;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .header p {
            color: #8B8B9E;
        }

        /* ========== 通用区域 ========== */
        .section {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 182, 193, 0.3);
            box-shadow: 0 4px 15px rgba(200, 180, 220, 0.1);
        }

        .section h2 {
            color: #DDA0DD;
            margin-bottom: 15px;
            font-size: 1.3rem;
            font-weight: 600;
            position: relative;
            padding-left: 10px;
        }

        .section h2::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background: linear-gradient(to bottom, #FFB6C1, #DDA0DD);
            border-radius: 3px;
        }

        /* ========== 照片墙 ========== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .photo-card {
            background: white;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 182, 193, 0.3);
        }

        .photo-card:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(200, 180, 220, 0.25);
        }

        .photo-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .photo-label {
            color: #8B8B9E;
            font-size: 0.85rem;
        }

        /* ========== 许愿瓶 ========== */
        .wish-bottle-section {
            position: relative;
            min-height: 200px;
        }

        .wish-bottle-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            min-height: 120px;
            align-items: center;
        }

        .wish-bottle {
            width: 60px;
            height: 100px;
            background: linear-gradient(to bottom, 
                rgba(255, 255, 255, 0.8), 
                rgba(255, 182, 193, 0.3));
            border: 2px solid rgba(255, 182, 193, 0.5);
            border-radius: 20px 20px 10px 10px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-size: 1.5rem;
        }

        .wish-bottle::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 15px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 182, 193, 0.5);
            border-bottom: none;
            border-radius: 5px 5px 0 0;
        }

        .wish-bottle:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(200, 180, 220, 0.25);
        }

        .wish-bottle.filled {
            background: linear-gradient(to bottom, 
                rgba(255, 255, 255, 0.8), 
                rgba(221, 160, 221, 0.5),
                rgba(135, 206, 235, 0.3));
            animation: bottleGlow 2s infinite;
        }

        @keyframes bottleGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(221, 160, 221, 0.3); }
            50% { box-shadow: 0 0 20px rgba(221, 160, 221, 0.6); }
        }

        .wish-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .wish-input {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255, 182, 193, 0.5);
            border-radius: 20px;
            font-family: '楷体', 'KaiTi', serif;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
        }

        .wish-empty {
            color: #8B8B9E;
            text-align: center;
            font-size: 0.9rem;
        }

        .wish-hint {
            color: #8B8B9E;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        /* ========== 许愿瓶弹窗 ========== */
        .wish-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .wish-modal-content {
            background: transparent;
            max-width: 400px;
            width: 90%;
        }

        .wish-paper {
            background: linear-gradient(to bottom, #FFF9F0, #FFF5E6);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            border: 1px solid #E8D5C8;
        }

        .wish-paper::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: rgba(255, 182, 193, 0.5);
            border-radius: 5px;
        }

        .wish-paper-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px dashed #E8D5C8;
        }

        .wish-paper-header span {
            font-size: 1.1rem;
            color: #8B5E8B;
            font-weight: 600;
        }

        .wish-modal-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #8B8B9E;
        }

        .wish-paper-lines {
            min-height: 100px;
            padding: 10px;
            background-image: repeating-linear-gradient(
                transparent,
                transparent 28px,
                #E8D5C8 28px,
                #E8D5C8 29px
            );
            line-height: 29px;
            margin-bottom: 15px;
        }

        .wish-paper-lines p {
            color: #5A5A6E;
            font-size: 1rem;
            line-height: 29px;
        }

        .wish-paper-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wish-paper-footer span {
            color: #8B8B9E;
            font-size: 0.85rem;
        }

        .wish-delete-btn {
            background: rgba(232, 122, 144, 0.1);
            border: 1px solid #E87A90;
            color: #E87A90;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .wish-delete-btn:hover {
            background: #E87A90;
            color: white;
        }

        /* ========== 答题 ========== */
        .quiz-question {
            font-size: 1.1rem;
            font-weight: 600;
            color: #8B5E8B;
            margin-bottom: 15px;
            text-align: center;
        }

        .quiz-option {
            background: white;
            border: 2px solid rgba(221, 160, 221, 0.3);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-option:hover {
            background: rgba(240, 240, 255, 0.5);
            border-color: #DDA0DD;
            transform: translateX(5px);
        }

        .quiz-feedback {
            text-align: center;
            color: #E87A90;
            font-weight: 600;
            margin-top: 10px;
            min-height: 30px;
        }

        .quiz-complete {
            text-align: center;
            padding: 20px;
        }

        .quiz-complete-text {
            font-size: 1.3rem;
            color: #8B5E8B;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .quiz-reward-btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            font-family: '楷体', 'KaiTi', serif;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.3);
        }

        .quiz-reward-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 165, 0, 0.5);
        }

        /* ========== 视频弹窗 ========== */
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        .video-modal-content {
            position: relative;
            max-width: 800px;
            width: 90%;
        }

        .video-modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 2001;
        }

        .video-modal-close:hover {
            background: #E87A90;
            color: white;
        }

        #rewardVideo {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* ========== 时间线 ========== */
        .timeline-item {
            background: white;
            border-radius: 15px;
            padding: 12px 18px;
            margin-bottom: 10px;
            border-left: 4px solid #DDA0DD;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(200, 180, 220, 0.1);
        }

        /* ========== 祝福墙 ========== */
        .blessing-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 5px;
        }

        .blessing-item {
            background: white;
            border-radius: 15px;
            padding: 10px 15px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            border-left: 3px solid #FFB6C1;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .blessing-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .blessing-input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid rgba(255, 182, 193, 0.5);
            border-radius: 20px;
            font-family: '楷体', 'KaiTi', serif;
            outline: none;
        }

        .blessing-btn {
            background: linear-gradient(135deg, #FFB6C1, #DDA0DD);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            font-family: '楷体', 'KaiTi', serif;
            white-space: nowrap;
        }

        /* ========== 工具类 ========== */
        .hidden {
            display: none !important;
        }

        footer {
            text-align: center;
            color: #8B8B9E;
            margin-top: 20px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            .main-container {
                padding: 1rem;
            }
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .countdown-display {
                gap: 5px;
            }
            .countdown-item {
                min-width: 50px;
                padding: 8px;
            }
            .countdown-number {
                font-size: 1.2rem;
            }
            .wish-input-group,
            .blessing-input-group {
                flex-direction: column;
            }
            .blessing-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 鼠标点击特效容器 -->
    <div class="click-effects-container" id="clickEffects"></div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- ===== 密码界面 ===== -->
        <div class="password-screen" id="passwordScreen">
            <img 
                src="images/rillakuma-family.png" 
                alt="轻松熊和他的朋友们" 
                class="rilakkuma-family-img"
                onerror="this.style.display='none'"
            >
            
            <h2 class="password-title">🔞 警告！未满18周岁禁止进入 🔞</h2>
            <p class="password-subtitle">🐻 Rilakkuma & Kiiroitori & Korilakkuma 🐤</p>
            
            <input type="password" id="passwordInput" class="password-input" placeholder="输入密码">
            <button class="password-btn" onclick="checkPassword()">小猪进入！</button>
            <div class="error-msg" id="errorMsg"></div>
            <p class="password-hint">💕 提示：8位，ブーブーの誕生日。A</p>
        </div>

        <!-- ===== 主内容 ===== -->
        <div class="main-content hidden" id="mainContent">
            <!-- 音乐播放器 -->
            <div class="music-player">
                <div class="music-player-header">
                    <span class="music-icon">🎵</span>
                    <span class="music-title">我们的歌单</span>
                </div>
                <div class="music-controls">
                    <button class="music-btn" onclick="prevSong()">⏮</button>
                    <button class="music-btn music-play-btn" id="playBtn" onclick="togglePlay()">▶️</button>
                    <button class="music-btn" onclick="nextSong()">⏭</button>
                </div>
                <div class="music-info">
                    <span id="currentSongName">点击播放</span>
                </div>
                <div class="music-progress">
                    <div class="music-progress-bar" id="progressBar"></div>
                </div>
                <audio id="audioPlayer" ontimeupdate="updateProgress()" onended="nextSong()"></audio>
            </div>

            <!-- 倒计时 -->
            <div class="countdown-section">
                <div class="countdown-title">🎂 距离生日还有 🎂</div>
                <div class="countdown-display">
                    <div class="countdown-item">
                        <span class="countdown-number" id="days">0</span>
                        <span class="countdown-label">天</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number" id="hours">0</span>
                        <span class="countdown-label">时</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number" id="minutes">0</span>
                        <span class="countdown-label">分</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number" id="seconds">0</span>
                        <span class="countdown-label">秒</span>
                    </div>
                </div>
            </div>

            <div class="header">
                <h1>🎂 生日快乐 🎂</h1>
                <p>轻松熊和朋友们一起为你庆祝！🐻🐤🤍</p>
            </div>

            <!-- 照片墙 -->
            <div class="section">
                <h2>📸 我们的回忆照片墙</h2>
                <div class="photo-grid" id="photoGrid"></div>
            </div>

            <!-- 许愿瓶游戏 -->
            <div class="section wish-bottle-section">
                <h2>🍾 许愿瓶 - 写下你的心愿</h2>
                <div class="wish-bottle-container" id="wishBottleContainer"></div>
                <div class="wish-input-group">
                    <input type="text" class="wish-input" id="wishInput" placeholder="写下心愿，放入许愿瓶...">
                    <button class="blessing-btn" onclick="addWish()">放入瓶子💕</button>
                </div>
                <p id="wishHint" class="wish-hint"></p>
            </div>

            <!-- 许愿瓶弹窗 -->
            <div class="wish-modal hidden" id="wishModal">
                <div class="wish-modal-content">
                    <div class="wish-paper">
                        <div class="wish-paper-header">
                            <span>📝 许愿纸条</span>
                            <button class="wish-modal-close" onclick="closeWishModal()">✕</button>
                        </div>
                        <div class="wish-paper-lines">
                            <p id="wishPaperText"></p>
                        </div>
                        <div class="wish-paper-footer">
                            <span id="wishPaperTime"></span>
                            <button class="wish-delete-btn" onclick="deleteWish()">🗑 删除</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 答题 -->
            <div class="section">
                <h2>🧸 轻松熊问答挑战</h2>
                <div class="quiz-question" id="quizQuestion"></div>
                <div id="quizOptions"></div>
                <div id="quizFeedback" class="quiz-feedback"></div>
                <div id="quizComplete" class="quiz-complete hidden">
                    <p class="quiz-complete-text">🎉 如此聪明的小猪！！🎉</p>
                    <button class="quiz-reward-btn" onclick="showReward()">点击此处有神秘奖励 🎁</button>
                </div>
            </div>

            <!-- 神秘奖励视频弹窗 -->
            <div class="video-modal hidden" id="videoModal">
                <div class="video-modal-content">
                    <button class="video-modal-close" onclick="closeVideo()">✕</button>
                    <video id="rewardVideo" controls>
                        <source src="99.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

            <!-- 时间线 -->
            <div class="section">
                <h2>⏳ 我们的时间线</h2>
                <div id="timelineList"></div>
            </div>

            <!-- 祝福墙 -->
            <div class="section">
                <h2>💌 祝福留言墙</h2>
                <div class="blessing-list" id="blessingList"></div>
                <div class="blessing-input-group">
                    <input type="text" class="blessing-input" id="blessingInput" placeholder="写下祝福...">
                    <button class="blessing-btn" onclick="sendBlessing()">发送💕</button>
                </div>
            </div>

            <footer>
                🐻 Rilakkuma 轻松熊 · Kiiroitori 奶油熊 · Korilakkuma 牛奶熊 🐤<br>
                一起祝最爱的你生日快乐！
            </footer>
        </div>
    </div>

    <script>
        // ========== 鼠标点击特效 ==========
        const clickEffects = document.getElementById('clickEffects');
        const clickElements = ['🐻', '💕', '🐱', '🎀', '🌸', '💜', '💙', '🐰', '🦋', '⭐', '🌈', '🍀', '🐤', '🤍'];
        
        document.addEventListener('click', function(e) {
            for (let i = 0; i < 3; i++) {
                const effect = document.createElement('div');
                effect.className = 'click-effect';
                effect.textContent = clickElements[Math.floor(Math.random() * clickElements.length)];
                effect.style.left = (e.clientX + (Math.random() - 0.5) * 40) + 'px';
                effect.style.top = (e.clientY + (Math.random() - 0.5) * 40) + 'px';
                effect.style.fontSize = (20 + Math.random() * 20) + 'px';
                effect.style.color = ['#FFB6C1', '#DDA0DD', '#87CEEB', '#FFD700'][Math.floor(Math.random() * 4)];
                clickEffects.appendChild(effect);
                
                setTimeout(() => { effect.remove(); }, 1500);
            }
        });

        // ========== 密码验证 ==========
        const CORRECT_PASSWORD = "20041112";

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (input === CORRECT_PASSWORD) {
                alert('居然答对了 介于生日的原因勉强让你进去看一下~');
                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('mainContent').classList.remove('hidden');
                errorMsg.textContent = '';
                initContent();
                startCountdown();
            } else {
                alert('你是哪块笨蛋奶油小饼干');
                document.getElementById('passwordInput').value = '';
                errorMsg.textContent = '不让笨猪猪进去！！';
            }
        }

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        // ========== 音乐播放器 ==========
        const songList = [
            { name: '歌曲1', src: '11.mp3' },
            { name: '歌曲2', src: '22.mp3' },
            { name: '歌曲3', src: '33.mp3' },
            { name: '歌曲4', src: '44.mp3' },
            { name: '歌曲5', src: '55.mp3' },
            { name: '歌曲6', src: '66.mp3' }
        ];
        
        let currentSongIndex = 0;
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const currentSongName = document.getElementById('currentSongName');
        const progressBar = document.getElementById('progressBar');
        
        function loadSong(index) {
            currentSongIndex = index;
            audioPlayer.src = songList[index].src;
            currentSongName.textContent = songList[index].name;
            audioPlayer.load();
        }
        
        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playBtn.textContent = '⏸';
            } else {
                audioPlayer.pause();
                playBtn.textContent = '▶️';
            }
        }
        
        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + songList.length) % songList.length;
            loadSong(currentSongIndex);
            audioPlayer.play();
            playBtn.textContent = '⏸';
        }
        
        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songList.length;
            loadSong(currentSongIndex);
            audioPlayer.play();
            playBtn.textContent = '⏸';
        }
        
        function updateProgress() {
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressBar.style.width = progress + '%';
        }
        
        loadSong(0);

        // ========== 生日倒计时 ==========
        function startCountdown() {
            function updateCountdown() {
                const now = new Date();
                const birthday = new Date(now.getFullYear(), 10, 12);
                
                if (now > birthday) {
                    birthday.setFullYear(birthday.getFullYear() + 1);
                }
                
                const diff = birthday - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                document.getElementById('days').textContent = days;
                document.getElementById('hours').textContent = hours;
                document.getElementById('minutes').textContent = minutes;
                document.getElementById('seconds').textContent = seconds;
            }
            
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        // ========== 初始化内容 ==========
        function initContent() {
            const photos = [
                { src: 'images/1.png', label: '照片1' },
                { src: 'images/2.png', label: '照片2' },
                { src: 'images/3.png', label: '照片3' },
                { src: 'images/4.png', label: '照片4' },
                { src: 'images/5.png', label: '照片5' },
                { src: 'images/6.png', label: '照片6' }
            ];

            const photoGrid = document.getElementById('photoGrid');
            photoGrid.innerHTML = '';
            photos.forEach((photo) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `<img src="${photo.src}" alt="${photo.label}" onerror="this.style.display='none'"><span class="photo-label">${photo.label}</span>`;
                card.onclick = () => alert('💕 ' + photo.label);
                photoGrid.appendChild(card);
            });

            loadWishBottles();
            loadQuiz();
            loadTimeline();
            loadBlessings();
        }

        // ========== 许愿瓶 ==========
        let wishes = [];
        let currentWishIndex = -1;

        function loadWishBottles() {
            const saved = localStorage.getItem('birthdayWishes');
            if (saved) {
                wishes = JSON.parse(saved);
                renderWishBottles();
            }
        }

        function renderWishBottles() {
            const container = document.getElementById('wishBottleContainer');
            container.innerHTML = '';
            wishes.forEach((wish, index) => {
                const bottle = document.createElement('div');
                bottle.className = 'wish-bottle filled';
                bottle.textContent = '💕';
                bottle.onclick = () => openWishModal(index);
                container.appendChild(bottle);
            });
            if (wishes.length === 0) {
                container.innerHTML = '<p class="wish-empty">还没有许愿瓶，快写下第一个心愿吧！</p>';
            }
        }

        function addWish() {
            const input = document.getElementById('wishInput');
            const wish = input.value.trim();
            const hint = document.getElementById('wishHint');
            if (wish) {
                const now = new Date();
                const timeStr = now.toLocaleString('zh-CN', { 
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
                wishes.push({ text: wish, time: timeStr });
                localStorage.setItem('birthdayWishes', JSON.stringify(wishes));
                renderWishBottles();
                input.value = '';
                hint.textContent = '💕 心愿已放入许愿瓶！';
            } else {
                hint.textContent = '写点愿望吧～';
            }
        }

        function openWishModal(index) {
            currentWishIndex = index;
            document.getElementById('wishPaperText').textContent = wishes[index].text;
            document.getElementById('wishPaperTime').textContent = '🕐 ' + wishes[index].time;
            document.getElementById('wishModal').classList.remove('hidden');
        }

        function closeWishModal() {
            document.getElementById('wishModal').classList.add('hidden');
        }

        function deleteWish() {
            if (currentWishIndex >= 0) {
                wishes.splice(currentWishIndex, 1);
                localStorage.setItem('birthdayWishes', JSON.stringify(wishes));
                renderWishBottles();
                closeWishModal();
            }
        }

        // ========== 答题 ==========
        const quizData = [
            { question: '轻松熊的好朋友奶油熊是什么动物？', options: ['小熊', '小鸡', '小鸭', '小兔'], correct: 1, correctText: '🐤 答对啦！' },
            { question: '轻松熊背后有什么特点？', options: ['有翅膀', '有拉链', '有口袋', '有蝴蝶结'], correct: 1, correctText: '🐻 正确！' },
            { question: '牛奶熊是什么颜色的？', options: ['棕色', '黄色', '白色', '粉色'], correct: 2, correctText: '🤍 对啦！' }
        ];

        let currentQuiz = 0;

        function loadQuiz() {
            if (currentQuiz >= quizData.length) {
                document.getElementById('quizQuestion').textContent = '';
                document.getElementById('quizOptions').innerHTML = '';
                document.getElementById('quizFeedback').textContent = '';
                document.getElementById('quizComplete').classList.remove('hidden');
                return;
            }
            const quiz = quizData[currentQuiz];
            document.getElementById('quizQuestion').textContent = quiz.question;
            const optionsDiv = document.getElementById('quizOptions');
            optionsDiv.innerHTML = '';
            document.getElementById('quizFeedback').textContent = '';
            quiz.options.forEach((opt, index) => {
                const option = document.createElement('div');
                option.className = 'quiz-option';
                option.textContent = String.fromCharCode(65 + index) + '. ' + opt;
                option.onclick = () => {
                    if (index === quiz.correct) {
                        document.getElementById('quizFeedback').textContent = quiz.correctText;
                        setTimeout(() => { currentQuiz++; loadQuiz(); }, 1500);
                    } else {
                        document.getElementById('quizFeedback').textContent = '🐻 再想想～';
                    }
                };
                optionsDiv.appendChild(option);
            });
        }

        function showReward() {
            document.getElementById('videoModal').classList.remove('hidden');
            document.getElementById('rewardVideo').play();
        }

        function closeVideo() {
            document.getElementById('videoModal').classList.add('hidden');
            document.getElementById('rewardVideo').pause();
        }

        // ========== 时间线 ==========
        function loadTimeline() {
            const data = [
                { time: '2023.03.14', text: '我们第一次相遇💕' },
                { time: '2023.06.15', text: '第一次一起过生日🎂' },
                { time: '2024.02.14', text: '第一个情人节🌹' },
                { time: '2024.11.12', text: '你的生日🎉' },
                { time: '今天', text: '未来的每一天✨' }
            ];
            const list = document.getElementById('timelineList');
            list.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = '<strong>' + item.time + '</strong> — ' + item.text;
                list.appendChild(div);
            });
        }

        // ========== 祝福墙 ==========
        function loadBlessings() {
            const blessings = ['🐻 轻松熊：生日快乐！', '🐤 奶油熊：叽叽叽～', '🤍 牛奶熊：生日快乐呀！', '🍯 送你蜂蜜蛋糕～'];
            const list = document.getElementById('blessingList');
            list.innerHTML = '';
            blessings.forEach(b => {
                const div = document.createElement('div');
                div.className = 'blessing-item';
                div.textContent = b;
                list.appendChild(div);
            });
        }

        function sendBlessing() {
            const input = document.getElementById('blessingInput');
            const text = input.value.trim();
            if (text) {
                const list = document.getElementById('blessingList');
                const div = document.createElement('div');
                div.className = 'blessing-item';
                div.textContent = '💕 ' + text;
                list.appendChild(div);
                input.value = '';
                list.scrollTop = list.scrollHeight;
            }
        }
    </script>
</body>
</html>
