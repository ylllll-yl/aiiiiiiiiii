<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻松熊 · 生日快乐</title>
    <style>
        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #ffe4ec 0%, #fff0f5 40%, #ffdde6 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* 密码界面 */
        .password-screen {
            background: #fff9fb;
            border-radius: 60px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px rgba(205, 92, 126, 0.2);
            border: 3px solid #ffccd9;
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        .bear-icons {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .password-title {
            font-size: 2rem;
            font-weight: 700;
            color: #b14e6b;
            margin-bottom: 0.5rem;
        }

        .password-subtitle {
            font-size: 1.1rem;
            color: #d47a94;
            margin-bottom: 2rem;
        }

        .password-input {
            width: 100%;
            padding: 15px 20px;
            border: 3px solid #ffb6c1;
            border-radius: 50px;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }

        .password-btn {
            background: #ffb6c1;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #4a1f2b;
            cursor: pointer;
            transition: 0.3s;
        }

        .password-btn:hover {
            background: #ff9eb2;
            transform: scale(1.05);
        }

        .error-msg {
            color: #d4506c;
            margin-top: 10px;
            min-height: 25px;
        }

        /* 主内容 */
        .main-content {
            max-width: 800px;
            width: 100%;
            background: #fff9fb;
            border-radius: 60px;
            padding: 2rem;
            border: 3px solid #ffccd9;
            box-shadow: 0 25px 50px rgba(205, 92, 126, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #b84a6a;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #be6e84;
            font-size: 1.2rem;
        }

        .section {
            background: #fff5f9;
            border-radius: 30px;
            padding: 25px;
            margin-bottom: 25px;
            border: 2px solid #ffccd9;
        }

        .section h2 {
            color: #a6475e;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        /* 照片墙 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .photo-card {
            background: #ffeef5;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid #ffcdd9;
        }

        .photo-card:hover {
            transform: scale(1.05);
            background: #ffe4ee;
        }

        .photo-emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        .photo-label {
            color: #a4586d;
            font-size: 0.9rem;
        }

        /* 心愿 */
        .wish-textarea {
            width: 100%;
            padding: 20px;
            border: 3px solid #ffb6c1;
            border-radius: 20px;
            font-size: 1.1rem;
            min-height: 120px;
            margin-bottom: 15px;
            outline: none;
            resize: vertical;
        }

        .wish-btn {
            background: #fcd5e4;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            color: #903552;
            cursor: pointer;
        }

        /* 答题 */
        .quiz-question {
            font-size: 1.3rem;
            font-weight: bold;
            color: #a2455d;
            margin-bottom: 20px;
            text-align: center;
        }

        .quiz-option {
            background: white;
            border: 2px solid #f5becb;
            border-radius: 30px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .quiz-option:hover {
            background: #ffe2ec;
            border-color: #f78ca0;
        }

        .quiz-feedback {
            text-align: center;
            color: #c2456b;
            font-weight: bold;
            margin-top: 15px;
            min-height: 30px;
        }

        /* 时间线 */
        .timeline-item {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-left: 5px solid #f68ca6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .timeline-item strong {
            color: #b84a6a;
            margin-right: 10px;
        }

        /* 祝福墙 */
        .blessing-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .blessing-item {
            background: white;
            border-radius: 20px;
            padding: 12px 18px;
            margin-bottom: 10px;
            border-left: 4px solid #ffb6c1;
        }

        .blessing-input-group {
            display: flex;
            gap: 10px;
        }

        .blessing-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #ffb6c1;
            border-radius: 30px;
            outline: none;
        }

        .blessing-btn {
            background: #ffadc0;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            color: #4e2533;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        footer {
            text-align: center;
            color: #bd8192;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #ffd9e8;
        }
    </style>
</head>
<body>
    <!-- 密码界面 -->
    <div class="password-screen" id="passwordScreen">
        <div class="bear-icons">🐻🎀🧸</div>
        <h1 class="password-title">轻松熊生日入口</h1>
        <p class="password-subtitle">🐻 只有你知道的小秘密 🍯</p>
        <input type="password" id="passwordInput" class="password-input" placeholder="输入密码">
        <br>
        <button class="password-btn" onclick="checkPassword()">🔐 进入</button>
        <div class="error-msg" id="errorMsg"></div>
        <p style="color: #b78391; font-size: 0.9rem; margin-top: 15px;">提示：20041112</p>
    </div>

    <!-- 主内容 -->
    <div class="main-content hidden" id="mainContent">
        <div class="header">
            <h1>🎂 生日快乐 🎂</h1>
            <p>轻松熊和小熊蜂蜜，全部给你🍯✨</p>
        </div>

        <!-- 照片墙 -->
        <div class="section">
            <h2>📸 我们的照片墙</h2>
            <div class="photo-grid" id="photoGrid"></div>
        </div>

        <!-- 生日心愿 -->
        <div class="section">
            <h2>🌠 生日心愿</h2>
            <textarea class="wish-textarea" id="wishTextarea" placeholder="写下你的生日愿望吧～"></textarea>
            <button class="wish-btn" onclick="saveWish()">💖 保存心愿</button>
            <p id="wishHint" style="color: #bb6b82; margin-top: 10px;"></p>
        </div>

        <!-- 答题挑战 -->
        <div class="section">
            <h2>🧸 甜蜜答题挑战</h2>
            <div class="quiz-question" id="quizQuestion"></div>
            <div id="quizOptions"></div>
            <div class="quiz-feedback" id="quizFeedback"></div>
        </div>

        <!-- 时间线 -->
        <div class="section">
            <h2>⏳ 我们的时间线</h2>
            <div id="timelineList"></div>
        </div>

        <!-- 祝福墙 -->
        <div class="section">
            <h2>💌 甜蜜祝福墙</h2>
            <div class="blessing-list" id="blessingList"></div>
            <div class="blessing-input-group">
                <input type="text" class="blessing-input" id="blessingInput" placeholder="写一句祝福吧...">
                <button class="blessing-btn" onclick="sendBlessing()">发送💕</button>
            </div>
        </div>

        <footer>🐻 轻松熊主题 · 专属于你的生日派对 🎀</footer>
    </div>

    <script>
        // 密码验证
        const CORRECT_PASSWORD = "20041112";

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (input === CORRECT_PASSWORD) {
                document.getElementById('passwordScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                errorMsg.textContent = '';
                initContent();
            } else {
                errorMsg.textContent = '🐻 密码不对哦，再想想～';
                document.getElementById('passwordInput').value = '';
            }
        }

        // 允许回车键提交密码
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // 初始化所有内容
        function initContent() {
            // 照片墙数据
            const photos = [
                { emoji: '🐻‍❄️', label: '轻松熊' },
                { emoji: '🍯', label: '蜂蜜罐子' },
                { emoji: '🎂', label: '生日蛋糕' },
                { emoji: '🎀', label: '蝴蝶结' },
                { emoji: '🌷', label: '花束' },
                { emoji: '✨', label: '星星' },
                { emoji: '🧸', label: '抱抱熊' },
                { emoji: '💖', label: '爱心' },
                { emoji: '🎈', label: '气球' },
                { emoji: '🍰', label: '甜点' },
                { emoji: '🎁', label: '礼物' },
                { emoji: '🌈', label: '彩虹' }
            ];

            const photoGrid = document.getElementById('photoGrid');
            photos.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <span class="photo-emoji">${photo.emoji}</span>
                    <span class="photo-label">${photo.label}</span>
                `;
                card.onclick = () => alert(`🐻 ${photo.label} - 我们的美好回忆！`);
                photoGrid.appendChild(card);
            });

            // 加载答题
            loadQuiz();

            // 加载时间线
            loadTimeline();

            // 加载祝福
            loadBlessings();

            // 从localStorage加载心愿
            const savedWish = localStorage.getItem('birthdayWish');
            if (savedWish) {
                document.getElementById('wishTextarea').value = savedWish;
            }
        }

        // 保存心愿
        function saveWish() {
            const wish = document.getElementById('wishTextarea').value.trim();
            const hint = document.getElementById('wishHint');
            if (wish) {
                localStorage.setItem('birthdayWish', wish);
                hint.textContent = '🐻 轻松熊已经收到心愿！一定会实现❤️';
            } else {
                hint.textContent = '写点愿望吧～小熊想听～';
            }
        }

        // 答题挑战
        const quizData = [
            {
                question: '我们第一次约会是在哪里？',
                options: ['电影院', '公园', '咖啡店', '商场'],
                correct: 1,
                correctText: '🐻 答对啦！就是公园～'
            },
            {
                question: '轻松熊最喜欢吃什么？',
                options: ['蜂蜜', '蛋糕', '水果', '牛奶'],
                correct: 0,
                correctText: '🍯 正确！轻松熊最爱蜂蜜～'
            },
            {
                question: '我最喜欢你的什么？',
                options: ['全部', '全部', '全部', '全部'],
                correct: 0,
                correctText: '❤️ 当然全部啦！'
            }
        ];

        let currentQuiz = 0;

        function loadQuiz() {
            const quiz = quizData[currentQuiz];
            document.getElementById('quizQuestion').textContent = quiz.question;
            
            const optionsDiv = document.getElementById('quizOptions');
            optionsDiv.innerHTML = '';
            document.getElementById('quizFeedback').textContent = '';
            
            quiz.options.forEach((opt, index) => {
                const option = document.createElement('div');
                option.className = 'quiz-option';
                option.textContent = `${String.fromCharCode(65 + index)}. ${opt}`;
                option.onclick = () => {
                    if (index === quiz.correct) {
                        document.getElementById('quizFeedback').textContent = quiz.correctText;
                        setTimeout(() => {
                            currentQuiz = (currentQuiz + 1) % quizData.length;
                            loadQuiz();
                        }, 1500);
                    } else {
                        document.getElementById('quizFeedback').textContent = '🐻 再想想～轻松熊觉得不对哟';
                    }
                };
                optionsDiv.appendChild(option);
            });
        }

        // 时间线
        function loadTimeline() {
            const timelineData = [
                { time: '2023.03.14', text: '我们第一次相遇💕' },
                { time: '2023.06.15', text: '第一次一起过生日🎂' },
                { time: '2024.02.14', text: '第一个情人节🌹' },
                { time: '2024.06.15', text: '第二次一起过生日🎉' },
                { time: '2024.11.12', text: '你的破壳日🐣轻松熊纪念' },
                { time: '今天', text: '未来每一天都要在一起✨' }
            ];

            const timelineList = document.getElementById('timelineList');
            timelineData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = `<strong>${item.time}</strong> — ${item.text}`;
                timelineList.appendChild(div);
            });
        }

        // 祝福墙
        function loadBlessings() {
            const blessings = [
                '🐻 轻松熊祝你生日快乐！🎂',
                '🍰 今天你是全宇宙最可爱的！',
                '🎁 爱你forever～',
                '💖 愿所有美好都如期而至'
            ];

            const blessingList = document.getElementById('blessingList');
            blessings.forEach(blessing => {
                const div = document.createElement('div');
                div.className = 'blessing-item';
                div.textContent = blessing;
                blessingList.appendChild(div);
            });
        }

        function sendBlessing() {
            const input = document.getElementById('blessingInput');
            const text = input.value.trim();
            
            if (text) {
                const blessingList = document.getElementById('blessingList');
                const div = document.createElement('div');
                div.className = 'blessing-item';
                div.textContent = `🧸 ${text}`;
                blessingList.appendChild(div);
                input.value = '';
                blessingList.scrollTop = blessingList.scrollHeight;
            }
        }
    </script>
</body>
</html>
