<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="stylesheet" href="css/1.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rilakkuma · 轻松熊生日祝福</title>
    <style>
        /* ========== 全局ins风格主题 ========== */
        :root {
            --pink: #FFB6C1;
            --pink-light: #FFE4E9;
            --purple: #DDA0DD;
            --purple-light: #E6E6FA;
            --blue: #87CEEB;
            --blue-light: #E0F0FF;
            --white: #FFFFFF;
            --cream: #FFF8F0;
            --text-dark: #5A5A6E;
            --text-light: #8B8B9E;
            --shadow-soft: 0 8px 25px rgba(200, 180, 220, 0.15);
            --shadow-hover: 0 12px 35px rgba(200, 180, 220, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, 
                #FFF0F5 0%, 
                #F5F0FF 25%, 
                #F0F8FF 50%, 
                #FFF5F7 75%, 
                #F8F0FF 100%);
            font-family: '楷体', 'KaiTi', 'STKaiti', '华文楷体', 'Microsoft YaHei', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            cursor: pointer;
        }

        /* ========== 鼠标点击特效容器 ========== */
        .click-effects-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .click-effect {
            position: fixed;
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            font-size: 24px;
            z-index: 9999;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.3);
            }
        }

        /* ========== 主容器 ========== */
        .main-container {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 2rem;
            border: 2px solid rgba(221, 160, 221, 0.3);
            box-shadow: var(--shadow-soft);
            position: relative;
        }

        /* ========== 密码界面 ========== */
        .password-screen {
            text-align: center;
            padding: 2rem 1rem;
        }

        .rilakkuma-family-img {
            width: 200px;
            height: auto;
            margin: 0 auto 20px;
            display: block;
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
        }

        .password-title {
            font-size: 1.5rem;
            color: #DDA0DD;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .password-subtitle {
            color: #8B8B9E;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .password-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #FFB6C1;
            border-radius: 25px;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 1rem;
            outline: none;
            transition: 0.3s;
            font-family: '楷体', 'KaiTi', serif;
            background: rgba(255, 255, 255, 0.9);
        }

        .password-input:focus {
            border-color: #DDA0DD;
            box-shadow: 0 0 0 5px rgba(221, 160, 221, 0.2);
        }

        .password-btn {
            background: linear-gradient(135deg, #FFB6C1, #DDA0DD);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            font-family: '楷体', 'KaiTi', serif;
        }

        .password-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        /* ========== 倒计时 ========== */
        .countdown-section {
            background: linear-gradient(135deg, #F5F0FF, #E0F0FF);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            border: 2px solid rgba(221, 160, 221, 0.3);
        }

        .countdown-title {
            font-size: 1.2rem;
            color: #8B5E8B;
            margin-bottom: 15px;
        }

        .countdown-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 15px;
            min-width: 70px;
            box-shadow: 0 4px 12px rgba(200, 180, 220, 0.2);
        }

        .countdown-number {
            font-size: 2rem;
            font-weight: 700;
            color: #DDA0DD;
            display: block;
        }

        .countdown-label {
            font-size: 0.85rem;
            color: #8B8B9E;
            margin-top: 5px;
        }

        /* ========== 内容区域 ========== */
        .main-content {
            display: none;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.2), rgba(221, 160, 221, 0.2));
            border-radius: 20px;
        }

        .header h1 {
            font-size: 2rem;
            color: #8B5E8B;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #8B8B9E;
        }

        .section {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 182, 193, 0.3);
        }

        .section h2 {
            color: #DDA0DD;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        /* ========== 照片墙 ========== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .photo-card {
            background: white;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid rgba(255, 182, 193, 0.3);
        }

        .photo-card:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-hover);
        }

        .photo-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .photo-label {
            color: #8B8B9E;
            font-size: 0.85rem;
        }

        /* ========== 许愿瓶游戏 ========== */
        .wish-bottle-section {
            position: relative;
            min-height: 300px;
        }

        .wish-bottle-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .wish-bottle {
            width: 60px;
            height: 100px;
            background: linear-gradient(to bottom, 
                rgba(255, 255, 255, 0.8), 
                rgba(255, 182, 193, 0.3));
            border: 2px solid rgba(255, 182, 193, 0.5);
            border-radius: 20px 20px 10px 10px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-size: 1.5rem;
        }

        .wish-bottle:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .wish-bottle::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 15px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 182, 193, 0.5);
            border-bottom: none;
            border-radius: 5px 5px 0 0;
        }

        .wish-bottle.filled {
            background: linear-gradient(to bottom, 
                rgba(255, 255, 255, 0.8), 
                rgba(221, 160, 221, 0.5));
        }

        .wish-input-group {
            display: flex;
            gap: 10px;
        }

        .wish-input {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255, 182, 193, 0.5);
            border-radius: 20px;
            font-family: '楷体', 'KaiTi', serif;
            outline: none;
        }

        /* ========== 答题区域 ========== */
        .quiz-question {
            font-size: 1.1rem;
            font-weight: 600;
            color: #8B5E8B;
            margin-bottom: 15px;
            text-align: center;
        }

        .quiz-option {
            background: white;
            border: 2px solid rgba(221, 160, 221, 0.3);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .quiz-option:hover {
            background: rgba(240, 240, 255, 0.5);
            border-color: #DDA0DD;
        }

        /* ========== 时间线 ========== */
        .timeline-item {
            background: white;
            border-radius: 15px;
            padding: 12px 18px;
            margin-bottom: 10px;
            border-left: 4px solid #DDA0DD;
            font-size: 0.95rem;
        }

        /* ========== 祝福墙 ========== */
        .blessing-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .blessing-item {
            background: white;
            border-radius: 15px;
            padding: 10px 15px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .blessing-input-group {
            display: flex;
            gap: 10px;
        }

        .blessing-input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid rgba(255, 182, 193, 0.5);
            border-radius: 20px;
            font-family: '楷体', 'KaiTi', serif;
            outline: none;
        }

        .blessing-btn {
            background: linear-gradient(135deg, #FFB6C1, #DDA0DD);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            font-family: '楷体', 'KaiTi', serif;
        }

        .hidden {
            display: none !important;
        }

        footer {
            text-align: center;
            color: #8B8B9E;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            .main-container {
                padding: 1rem;
            }
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .countdown-display {
                gap: 8px;
            }
            .countdown-item {
                min-width: 60px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 鼠标点击特效容器 -->
    <div class="click-effects-container" id="clickEffects"></div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- ===== 密码界面 ===== -->
        <div class="password-screen" id="passwordScreen">
            <img 
                src="images/rillakuma-family.png" 
                alt="轻松熊和他的朋友们" 
                class="rilakkuma-family-img"
                onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23FFE4E9%22 width=%22200%22 height=%22200%22 rx=%2220%22/%3E%3Ctext x=%22100%22 y=%22100%22 text-anchor=%22middle%22 font-size=%2280%22%3E🐻%3C/text%3E%3C/svg%3E'"
            >
            
            <h2 class="password-title">🔞 警告！未满18周岁禁止进入 🔞</h2>
            <p class="password-subtitle">🐻 Rilakkuma & Kiiroitori & Korilakkuma 🐤</p>
            
            <input type="password" id="passwordInput" class="password-input" placeholder="输入密码">
            <button class="password-btn" onclick="checkPassword()">小猪进入！</button>
            <div class="error-msg" id="errorMsg" style="color: #E87A90; margin-top: 10px; min-height: 25px;"></div>
            <p style="color: #8B8B9E; font-size: 0.85rem; margin-top: 10px;">💕 提示：8位，ブーブーの誕生日。A</p>
        </div>

        <!-- ===== 主内容 ===== -->
        <div class="main-content" id="mainContent">
            <!-- 倒计时 -->
            <div class="countdown-section">
                <div class="countdown-title">🎂 距离生日还有 🎂</div>
                <div class="countdown-display" id="countdownDisplay">
                    <div class="countdown-item">
                        <span class="countdown-number" id="days">0</span>
                        <span class="countdown-label">天</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number" id="hours">0</span>
                        <span class="countdown-label">时</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number" id="minutes">0</span>
                        <span class="countdown-label">分</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number" id="seconds">0</span>
                        <span class="countdown-label">秒</span>
                    </div>
                </div>
            </div>

            <div class="header">
                <h1>🎂 生日快乐 🎂</h1>
                <p>轻松熊和朋友们一起为你庆祝！🐻🐤🤍</p>
            </div>

            <!-- 照片墙 -->
            <div class="section">
                <h2>📸 我们的回忆照片墙</h2>
                <div class="photo-grid" id="photoGrid"></div>
            </div>

            <!-- 许愿瓶游戏 -->
            <div class="section wish-bottle-section">
                <h2>🍾 许愿瓶 - 写下你的心愿</h2>
                <div class="wish-bottle-container" id="wishBottleContainer"></div>
                <div class="wish-input-group">
                    <input type="text" class="wish-input" id="wishInput" placeholder="写下心愿，放入许愿瓶...">
                    <button class="blessing-btn" onclick="addWish()">放入瓶子💕</button>
                </div>
                <p id="wishHint" style="color: #8B8B9E; margin-top: 10px; font-size: 0.9rem;"></p>
            </div>

            <!-- 答题 -->
            <div class="section">
                <h2>🧸 轻松熊问答挑战</h2>
                <div class="quiz-question" id="quizQuestion"></div>
                <div id="quizOptions"></div>
                <div id="quizFeedback" style="text-align: center; color: #E87A90; font-weight: 600; margin-top: 10px;"></div>
            </div>

            <!-- 时间线 -->
            <div class="section">
                <h2>⏳ 我们的时间线</h2>
                <div id="timelineList"></div>
            </div>

            <!-- 祝福墙 -->
            <div class="section">
                <h2>💌 祝福留言墙</h2>
                <div class="blessing-list" id="blessingList"></div>
                <div class="blessing-input-group">
                    <input type="text" class="blessing-input" id="blessingInput" placeholder="写下祝福...">
                    <button class="blessing-btn" onclick="sendBlessing()">发送💕</button>
                </div>
            </div>

            <footer>
                🐻 Rilakkuma 轻松熊 · Kiiroitori 奶油熊 · Korilakkuma 牛奶熊 🐤<br>
                一起祝最爱的你生日快乐！
            </footer>
        </div>
    </div>

    <script>
        // ========== 鼠标点击特效 ==========
        const clickEffects = document.getElementById('clickEffects');
        const clickElements = ['🐻', '💕', '🐱', '🎀', '🌸', '💜', '💙', '🐰', '🦋', '⭐', '🌈', '🍀'];
        
        document.addEventListener('click', function(e) {
            for (let i = 0; i < 3; i++) {
                const effect = document.createElement('div');
                effect.className = 'click-effect';
                effect.textContent = clickElements[Math.floor(Math.random() * clickElements.length)];
                effect.style.left = (e.clientX + (Math.random() - 0.5) * 40) + 'px';
                effect.style.top = (e.clientY + (Math.random() - 0.5) * 40) + 'px';
                effect.style.fontSize = (20 + Math.random() * 20) + 'px';
                effect.style.color = ['#FFB6C1', '#DDA0DD', '#87CEEB', '#FFD700'][Math.floor(Math.random() * 4)];
                clickEffects.appendChild(effect);
                
                setTimeout(() => {
                    effect.remove();
                }, 1500);
            }
        });

        // ========== 密码验证 ==========
        const CORRECT_PASSWORD = "20041112";

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (input === CORRECT_PASSWORD) {
                alert('居然答对了 介于生日的原因勉强让你进去看一下~');
                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                errorMsg.textContent = '';
                initContent();
                startCountdown();
            } else {
                alert('你是哪块笨蛋奶油小饼干');
                document.getElementById('passwordInput').value = '';
                errorMsg.textContent = '不让笨猪猪进去！！';
            }
        }

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        // ========== 生日倒计时 ==========
        function startCountdown() {
            function updateCountdown() {
                const now = new Date();
                const birthday = new Date(now.getFullYear(), 10, 12); // 11月12日
                
                if (now > birthday) {
                    birthday.setFullYear(birthday.getFullYear() + 1);
                }
                
                const diff = birthday - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                document.getElementById('days').textContent = days;
                document.getElementById('hours').textContent = hours;
                document.getElementById('minutes').textContent = minutes;
                document.getElementById('seconds').textContent = seconds;
            }
            
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        // ========== 初始化内容 ==========
        function initContent() {
            // 照片墙 - 使用本地图片
            const photos = [
                { src: 'images/1.png', label: '我们的第一张照片', alt: '照片1' },
                { src: 'images/2.png', label: '我们的第二张照片', alt: '照片2' },
                { src: 'images/3.png', label: '我们的第三张照片', alt: '照片3' },
                { src: 'images/4.png', label: '我们的第四张照片', alt: '照片4' },
                { src: 'images/5.png', label: '我们的第五张照片', alt: '照片5' },
                { src: 'images/6.png', label: '我们的第六张照片', alt: '照片6' }
            ];

            const photoGrid = document.getElementById('photoGrid');
            photoGrid.innerHTML = '';
            photos.forEach((photo) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <img src="${photo.src}" alt="${photo.alt}" loading="lazy" onerror="this.style.display='none'">
                    <span class="photo-label">${photo.label}</span>
                `;
                card.onclick = () => alert(`💕 ${photo.label}`);
                photoGrid.appendChild(card);
            });

            // 许愿瓶
            loadWishBottles();
            
            // 加载问答
            loadQuiz();
            
            // 加载时间线
            loadTimeline();
            
            // 加载祝福
            loadBlessings();
        }

        // ========== 许愿瓶游戏 ==========
        let wishes = [];

        function loadWishBottles() {
            const savedWishes = localStorage.getItem('birthdayWishes');
            if (savedWishes) {
                wishes = JSON.parse(savedWishes);
                renderWishBottles();
            }
        }

        function renderWishBottles() {
            const container = document.getElementById('wishBottleContainer');
            container.innerHTML = '';
            
            wishes.forEach((wish, index) => {
                const bottle = document.createElement('div');
                bottle.className = 'wish-bottle filled';
                bottle.textContent = '💕';
                bottle.title = wish;
                bottle.onclick = () => {
                    alert(`🍾 许愿瓶 #${index + 1}: ${wish}`);
                };
                container.appendChild(bottle);
            });
            
            if (wishes.length === 0) {
                container.innerHTML = '<p style="color: #8B8B9E;">还没有许愿瓶，快写下第一个心愿吧！</p>';
            }
        }

        function addWish() {
            const input = document.getElementById('wishInput');
            const wish = input.value.trim();
            const hint = document.getElementById('wishHint');
            
            if (wish) {
                wishes.push(wish);
                localStorage.setItem('birthdayWishes', JSON.stringify(wishes));
                renderWishBottles();
                input.value = '';
                hint.textContent = '💕 心愿已放入许愿瓶！';
            } else {
                hint.textContent = '写点愿望吧～';
            }
        }

        // ========== 答题 ==========
        const quizData = [
            {
                question: '轻松熊的好朋友奶油熊是什么动物？',
                options: ['小熊', '小鸡', '小鸭', '小兔'],
                correct: 1,
                correctText: '🐤 答对啦！奶油熊是小黄鸡哦～'
            },
            {
                question: '轻松熊背后有什么特点？',
                options: ['有翅膀', '有拉链', '有口袋', '有蝴蝶结'],
                correct: 1,
                correctText: '🐻 正确！轻松熊背后有拉链呢～'
            },
            {
                question: '牛奶熊是什么颜色的？',
                options: ['棕色', '黄色', '白色', '粉色'],
                correct: 2,
                correctText: '🤍 对啦！牛奶熊是白色的小熊～'
            }
        ];

        let currentQuiz = 0;

        function loadQuiz() {
            const quiz = quizData[currentQuiz];
            document.getElementById('quizQuestion').textContent = quiz.question;
            
            const optionsDiv = document.getElementById('quizOptions');
            optionsDiv.innerHTML = '';
            document.getElementById('quizFeedback').textContent = '';
            
            quiz.options.forEach((opt, index) => {
                const option = document.createElement('div');
                option.className = 'quiz-option';
                option.textContent = `${String.fromCharCode(65 + index)}. ${opt}`;
                option.onclick = () => {
                    if (index === quiz.correct) {
                        document.getElementById('quizFeedback').textContent = quiz.correctText;
                        setTimeout(() => {
                            currentQuiz = (currentQuiz + 1) % quizData.length;
                            loadQuiz();
                        }, 2000);
                    } else {
                        document.getElementById('quizFeedback').textContent = '🐻 再想想～轻松熊觉得不对哦';
                    }
                };
                optionsDiv.appendChild(option);
            });
        }

        // ========== 时间线 ==========
        function loadTimeline() {
            const timelineData = [
                { time: '2023.03.14', text: '我们第一次相遇💕' },
                { time: '2023.06.15', text: '第一次一起过生日🎂' },
                { time: '2024.02.14', text: '第一个情人节🌹' },
                { time: '2024.11.12', text: '你的生日，轻松熊来庆祝🎉' },
                { time: '今天', text: '未来的每一天都有轻松熊陪伴✨' }
            ];

            const timelineList = document.getElementById('timelineList');
            timelineList.innerHTML = '';
            timelineData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = `<strong style="color: #DDA0DD;">${item.time}</strong> — ${item.text}`;
                timelineList.appendChild(div);
            });
        }

        // ========== 祝福墙 ==========
        function loadBlessings() {
            const blessings = [
                '🐻 轻松熊：生日快乐！',
                '🐤 奶油熊：叽叽叽～生日快乐！',
                '🤍 牛奶熊：生日快乐呀！',
                '🍯 送你一大罐蜂蜜蛋糕～'
            ];

            const blessingList = document.getElementById('blessingList');
            blessingList.innerHTML = '';
            blessings.forEach(blessing => {
                const div = document.createElement('div');
                div.className = 'blessing-item';
                div.textContent = blessing;
                blessingList.appendChild(div);
            });
        }

        function sendBlessing() {
            const input = document.getElementById('blessingInput');
            const text = input.value.trim();
            
            if (text) {
                const blessingList = document.getElementById('blessingList');
                const div = document.createElement('div');
                div.className = 'blessing-item';
                div.textContent = `💕 ${text}`;
                blessingList.appendChild(div);
                input.value = '';
                blessingList.scrollTop = blessingList.scrollHeight;
            }
        }
    </script>
</body>
</html>
